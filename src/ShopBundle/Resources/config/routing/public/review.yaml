shop_review_product_reviews_list:
    path: /api/product/{id}/reviews
    controller: ShopBundle\Controller\ReviewController::productReviewsListAction
    methods: GET

shop_review_new:
    path: /api/review/new
    controller: ShopBundle\Controller\ReviewController::newAction
    methods: POST

shop_review_edit:
    path: /api/review/{id}/edit
    controller: ShopBundle\Controller\ReviewController::editAction
    methods: PUT

shop_review_delete:
    path: /api/review/{id}/delete
    controller: ShopBundle\Controller\ReviewController::deleteAction
    methods: DELETE

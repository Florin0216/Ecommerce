services:
    AppBundle\Controller\:
        resource: "%kernel.project_dir%/src/AppBundle/Controller/*"
        autowire: true
        autoconfigure: true

    AppBundle\Entity\:
        resource: "%kernel.project_dir%/src/AppBundle/Entity/*"
        autowire: true
        autoconfigure: true

    AppBundle\Repository\:
        resource: "%kernel.project_dir%/src/AppBundle/Repository/*"
        autowire: true
        autoconfigure: true

    AppBundle\Services\:
        resource: "%kernel.project_dir%/src/AppBundle/Services/*"
        autowire: true
        autoconfigure: true

    AppBundle\Vich\Uploader\Namer\:
        resource: '%kernel.project_dir%/src/AppBundle/Vich/Uploader/Namer/*'
        public: true
        autowire: true
        autoconfigure: true
